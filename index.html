<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Elijah's Birthday Party</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no">
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    width: 100%;
    background: #0b1550;
    overflow: hidden;
  }

  .wrap {
    height: 100vh;
    width: 100vw;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  img {
    max-width: 100vw;
    max-height: 100vh;
    width: auto;
    height: auto;
    object-fit: contain;
  }
</style>
</head>
<body>
  <div class="wrap">
    <img src="/welcome.png" alt="Welcome to Elijah's Birthday Party">
  </div>
</body>
</html>
